format: repo-guard/requirement-v1
id: FGMR-IMPORT-001
normative: "### FGMR-IMPORT-001 — Локальный импортёр C++20 должен структурно проверять MAP (три ненулевых байта размеров и 4 байта на ячейку), MCD (62 байта на запись) и LOFTEMPS (32 байта на запись). Входные файлы открываются только на чтение, символические ссылки отклоняются, посторонние и скрытые записи игнорируются. Результат должен быть корректным JSON в UTF-8 без абсолютных путей и содержимого игровых файлов. Параметр --report создаёт новый файл за пределами исходного каталога и сохраняет существующий файл при совпадении имени. Команды inspect и validate проверяются на собственных синтетических данных. Структурная проверка ограничена размерностями и длинами."
