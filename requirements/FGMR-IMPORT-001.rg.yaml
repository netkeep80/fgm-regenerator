format: repo-guard/requirement-v1
id: FGMR-IMPORT-001
normative: "### FGMR-IMPORT-001 — Локальный C++20 импортёр должен проверять структуру файлов MAP (три байта X/Y/Z и 4 байта на ячейку), MCD (62 байта на запись) и LOFTEMPS (32 байта на запись), безопасно работать с повреждёнными файлами и символическими ссылками, игнорировать посторонние ресурсы и выдавать JSON без абсолютных путей и игровых байтов. Команды inspect и validate должны быть детерминированно протестированы на собственных синтетических данных. Структурная проверка не означает интерпретации игровых полей."
