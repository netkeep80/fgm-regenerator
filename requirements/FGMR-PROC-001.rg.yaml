format: repo-guard/requirement-v1
id: FGMR-PROC-001
normative: "### FGMR-PROC-001 — Разработка семейства FGM/UFO Fractal должна выполняться линейно: единственная активная задача и единственный Draft PR одновременно. Перед передачей следующему чату или к следующему этапу необходимо зафиксировать в исходном Issue принятые решения, состояние, точные BASE/HEAD/TREE, результаты CI и следующий шаг, а нормативные решения описать в Requirements. Слияние разрешается только после явного авторского принятия точного HEAD и SHA-защищённой операции."
lifecycle:
  accepted: true
  current: true
  published: false
relations:
  - predicates: [derives_from]
    target:
      kind: requirement
      id: "FGMR-PROJECT-000"
  - predicates: [documents]
    target:
      kind: artifact
      path: "docs/current-step.md"
  - predicates: [documents]
    target:
      kind: artifact
      path: "README.md"
